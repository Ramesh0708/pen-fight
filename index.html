<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pen Fight — Last Bench</title>
  <meta name="description" content="Flick a school pen down the bench. Play Ramesh, or share a link and play a friend.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🖊️%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Schoolbell&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="classroom">
    <div class="clock" aria-hidden="true">
      <span class="hand hour"></span>
      <span class="hand minute"></span>
      <span class="pin"></span>
    </div>
    <div class="window" aria-hidden="true"></div>

    <header class="board">
      <p class="board-class">IV · B · last bench</p>
      <h1 class="chalk-title">Pen Fight</h1>
      <p class="scoreline">
        <span id="you-name">You</span>
        <strong id="you-score">0</strong>
        <span class="dash" aria-hidden="true">—</span>
        <strong id="opp-score">0</strong>
        <span id="opp-name">Ramesh</span>
      </p>
      <p id="turn-label" class="turn">Period 4 · last bench</p>
    </header>

    <div class="bench">
      <div class="ruler" aria-hidden="true"></div>
      <div class="eraser" aria-hidden="true"></div>
      <p class="carving" aria-hidden="true">IV-B</p>

      <div class="sheet">
        <canvas id="desk-canvas" width="1000" height="640" aria-label="Wooden school bench. Drag to flick your pen."></canvas>
        <div id="overlay" class="overlay">
          <div class="note">
            <h2 id="note-title">Recess rules</h2>
            <p id="note-body"></p>
            <div id="lobby">
              <label class="name-label" for="your-name">Your name</label>
              <input id="your-name" maxlength="16" value="You" autocomplete="nickname">
              <p class="pick-label">Your pen</p>
              <div id="your-pens" class="pen-picks"></div>
              <div id="opp-pick">
                <p class="pick-label">Ramesh's pen</p>
                <div id="opp-pens" class="pen-picks"></div>
              </div>
            </div>
            <div id="share-box" hidden>
              <p>Send this link. The match starts when they sit down.</p>
              <input id="share-url" readonly>
              <button id="copy-link" type="button">Copy link</button>
            </div>
            <div class="actions">
              <button id="note-btn" type="button">Play Ramesh</button>
              <button id="share-btn" type="button">Share this bench</button>
            </div>
          </div>
        </div>
      </div>

      <div class="bench-seat" aria-hidden="true"></div>
      <div class="bench-legs" aria-hidden="true"><span></span><span></span></div>

      <div class="desk-foot">
        <p id="status">Drag across the bench to flick.</p>
        <p>First to 3</p>
      </div>
    </div>
  </div>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
